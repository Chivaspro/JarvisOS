name: CI

# Two jobs, deliberately split by what each runner can honestly do:
#   * portable-core  — Linux: byte-compile everything and prove the suite still
#                      COLLECTS (no import errors, no missing files) plus the
#                      Node-runtime gate consistency test, which needs no
#                      third-party packages at all.
#   * windows-desktop — the real desktop suite (PyQt6, audio, Windows APIs),
#                      which is the platform this application actually ships on.
#
# No job needs an API key, a microphone, a camera, a signed-in browser or a
# destructive action. Missing optional engines make their tests SKIP, which is
# the honest outcome. There is intentionally no build badge until this workflow
# has actually run green on the remote.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: Portable core (Linux, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile every first-party module
        run: |
          python - <<'PY'
          import compileall, re, sys
          rx = re.compile(r"(node_modules|UI-TARS|\.venv|build|dist|\.git|\.pytest_tmp)")
          ok = compileall.compile_dir(".", quiet=1, rx=rx)
          print("compileall:", "ok" if ok else "FAILED")
          sys.exit(0 if ok else 1)
          PY
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Node-runtime gate consistency (manifest vs lock vs wizard vs installer)
        run: python -m pytest tests/unit/test_node_version_gate.py -q
      - name: The full suite must at least COLLECT
        run: python -m pytest --collect-only -q

  windows-desktop:
    name: Desktop suite (Windows, py3.13)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit + hybrid-voice suites
        run: python -m pytest tests/unit tests/hybrid_voice -q -p no:cacheprovider
